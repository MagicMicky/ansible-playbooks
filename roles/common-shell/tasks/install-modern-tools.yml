---
# Install modern shell tools

- name: Install modern tools (macOS)
  community.general.homebrew:
    name:
      - fzf
      - zoxide
      - bat
      - eza
      - fd
      - ripgrep
    state: present
  when: is_macos

# Update apt cache (always runs, even in check mode to avoid package lookup failures)
- name: Update apt cache (Debian/Ubuntu)
  apt:
    update_cache: yes
  become: yes
  when: is_debian
  check_mode: no
  changed_when: false

- name: Install available modern tools (Debian/Ubuntu)
  apt:
    name:
      - ripgrep
      - git  # Required for fzf installation
    state: present
  become: yes
  when: is_debian

- name: Ensure .local/bin directory exists
  file:
    path: "{{ target_home }}/.local/bin"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_group }}"
    mode: '0755'
  become: yes
  become_user: "{{ target_user }}"

- name: Check if fzf is installed
  stat:
    path: "{{ target_home }}/.fzf/bin/fzf"
  become: yes
  become_user: "{{ target_user }}"
  register: fzf_binary

- name: Install fzf with shell integration (Linux)
  shell: |
    git clone --depth 1 https://github.com/junegunn/fzf.git {{ target_home }}/.fzf
    cd {{ target_home }}/.fzf && ./install --bin
    ln -sf {{ target_home }}/.fzf/bin/fzf {{ target_home }}/.local/bin/fzf
  become: yes
  become_user: "{{ target_user }}"
  when:
    - not is_macos
    - not fzf_binary.stat.exists
  changed_when: true

- name: Check if zoxide is installed
  stat:
    path: "{{ target_home }}/.local/bin/zoxide"
  become: yes
  become_user: "{{ target_user }}"
  register: zoxide_binary

# Install the latest zoxide GitHub release without the GitHub API: the upstream
# install.sh queries api.github.com, which rate-limits shared CI runner IPs.
# The latest tag comes from the releases/latest web redirect instead.
- name: Install latest zoxide release (Linux)
  when:
    - not is_macos
    - not zoxide_binary.stat.exists
    - not ansible_check_mode
  block:
    - name: Resolve latest zoxide release tag
      uri:
        url: https://github.com/ajeetdsouza/zoxide/releases/latest
        method: HEAD
        follow_redirects: none
        status_code: [301, 302]
      register: zoxide_latest
      until: zoxide_latest.location is defined
      retries: 3
      delay: 10

    - name: Set zoxide release facts
      set_fact:
        zoxide_version: "{{ zoxide_latest.location | regex_replace('^.*/tag/v?', '') }}"
        zoxide_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64', 'arm64': 'aarch64'}[ansible_architecture] }}"

    - name: Download and extract zoxide binary
      unarchive:
        src: "https://github.com/ajeetdsouza/zoxide/releases/download/v{{ zoxide_version }}/zoxide-{{ zoxide_version }}-{{ zoxide_arch }}-unknown-linux-musl.tar.gz"
        dest: "{{ target_home }}/.local/bin"
        remote_src: yes
        include:
          - zoxide
        mode: '0755'
      become: yes
      become_user: "{{ target_user }}"
      register: zoxide_download
      until: zoxide_download is succeeded
      retries: 3
      delay: 10

# Note: bat and eza installation on Linux may require additional steps
# They can be installed via cargo, snap, or downloaded from GitHub releases
# For now, we'll document this and handle it separately if needed
